# ============================================================
# Autohop — XcodeGen project specification
# ============================================================
#
# Prerequisites:
#   brew install xcodegen
#
# Generate the Xcode project:
#   cd work/Autohop
#   xcodegen generate
#
# First-time Xcode setup (one-time, ~2 minutes):
#   1. Open Autohop.xcodeproj
#   2. Select the Autohop target → Signing & Capabilities
#   3. Choose your Team and confirm the bundle ID
#   4. Select any iPhone simulator → ▶ Run
#
# The SwiftPM package (Package.swift) stays intact for the
# smoke-test executables — run them with `swift run <name>`.
# ============================================================

name: Autohop

options:
  xcodeVersion: "15.4"
  createIntermediateGroups: true   # mirrors the folder hierarchy in Xcode's navigator
  generateEmptyDirectories: false

# ── Global build settings ────────────────────────────────────────────────────

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # Default for ancillary iOS targets; app overrides below
    ALWAYS_SEARCH_USER_PATHS: false
    CLANG_ENABLE_MODULES: true

configs:
  Debug: debug
  Release: release

# ── Swift Package dependencies ───────────────────────────────────────────────
# The app target compiles the AutohopCore sources directly (see below), so the
# GRDB SQLite dependency that AutohopDatabase.swift needs is declared here for
# the Xcode build. Keep the version in sync with Package.swift.
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  # tvOS Phase 1: the TV target consumes AutohopCore as a LIBRARY product from
  # the local SwiftPM package at the repo root (Package.swift) — per the tvOS
  # proposal §6, NOT the iOS source glob. The iOS target keeps compiling core
  # sources directly and does NOT depend on this package (no duplicate symbols).
  # If Xcode misbehaves with a local package rooted at the project directory,
  # the documented fallback is compiling the Package.swift `sources:` list
  # directly into AutohopTV.
  AutohopCore:
    path: .

# ── Targets ──────────────────────────────────────────────────────────────────

targets:

  # ── App ────────────────────────────────────────────────────────────────────

  Autohop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # Include everything in this directory EXCEPT the SwiftPM artefacts and
    # the smoke-test executables (which all contain top-level `main.swift`
    # files that would conflict with `@main AutohopApp`).
    sources:
      - path: .
        excludes:
          - Package.swift                    # SwiftPM manifest — would compile as source
          - Package.resolved
          - project.yml
          - README.md
          - Autohop.storekit                # local StoreKit testing only; never ship in 1.3
          - "Autohop.xcodeproj/**"          # project metadata is not an app resource
          - "Design/**"                     # source artwork; compiled app icon lives in Assets.xcassets
          - "AppStoreScreenshots/**"        # marketing source images, never bundled
          - "**/*.md"
          - "**/*.swp"                        # Vim swap files — never bundle as resources
          - "**/.*.swp"                        # hidden Vim swap files (e.g. .PAGES.md.swp)
          - ".*.swp"                           # root-level hidden swap file (glob safety)
          - ".build/**"
          - ".github/**"                     # CI metadata — never bundle in the app
          - ".git/**"                        # git internals — never bundle as app resources
          - ".swiftpm/**"                    # SwiftPM/Xcode workspace metadata
          - "Scripts/**"                     # developer/release tooling, not runtime resources
                                             # (branch/tag/log basenames can collide → "duplicate output file")
          - "SmokeTests/**"                  # contains main.swift
          - "OPMLSmokeTests/**"              # contains main.swift
          - "SubscriptionStoreSmokeTests/**" # contains main.swift
          - "DownloadManagerSmokeTests/**"   # contains main.swift
          - "StatsSmokeTests/**"             # contains main.swift
          - "Tests/**"                       # picked up by AutohopTests target instead
          - "TV/**"                          # tvOS target sources — never in the iPhone app
          - "TVTests/**"                     # tvOS-only XCTest sources — never in the iPhone app
          - "TVTopShelf/**"                  # tvOS extension sources/plist — never in the iPhone app
          - "Widgets/**"                     # widget extension sources — shared contract is re-added below
      # AI CONTEXT — The widget display/storage contract is deliberately compiled
      # into both the app and extension. Nothing else under Widgets enters the app
      # target, preventing the extension's @main entry point from colliding with
      # AutohopApp and keeping future widget-only UI out of the application binary.
      - path: Widgets/Shared

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinperry.autohop
        TARGETED_DEVICE_FAMILY: "1,2"        # Native iPhone + iPad — explicit on the app target
        # iPhone and Apple TV use only the user's private iCloud account for
        # cross-device synchronization. No subscription or relay feature gates
        # exist in either configuration.
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QT3N6256FG          # Kevin Perry — keeps signing through regen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule

    # AI CONTEXT — Must remain a post-build phase and declare the assembled
    # Info.plist as an input. The dependency edge forces ProcessInfoPlistFile to
    # finish before this mutation; without it Xcode may overwrite the embedded
    # provenance with the source plist's `unavailable` defaults before signing.
    postBuildScripts:
      - name: Embed Git Commit Identity
        script: Scripts/embed-git-commit.sh
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/autohop-provenance-embedded"
        basedOnDependencyAnalysis: false

    # Info.plist is generated by XcodeGen from the properties below.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Autohop
        CFBundleIconName: AppIcon
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        GitCommitSHA: unavailable
        GitWorkingTreeDirty: unknown
        SourceFingerprint: unavailable
        BuildTimestampUTC: unavailable
        # Stage 3 widget navigation. WidgetDeepLinkParser accepts only the four
        # documented hosts and rejects malformed identities.
        CFBundleURLTypes:
          - CFBundleURLName: com.kevinperry.autohop.widget-navigation
            CFBundleURLSchemes:
              - autohop

        # ── Launch screen ──────────────────────────────────────────────────
        UILaunchScreen:
          UIColorName: LaunchBackground

        # ── Device / orientation ───────────────────────────────────────────
        UIRequiredDeviceCapabilities:
          - arm64
        # AppDelegate keeps compact iPhone screens portrait and opens video in
        # landscape. Native iPad supports every orientation so Stage Manager,
        # Split View and hardware-keyboard use are not artificially constrained.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # ── Background modes ───────────────────────────────────────────────
        # audio      → AVAudioSession keeps playback alive when screen locks
        # fetch      → BGAppRefreshTask for short periodic feed polling
        # processing → BGProcessingTask for a longer charging+Wi-Fi feed catch-up
        #              (drains the due-feed backlog, e.g. overnight)
        # remote-notification → CloudKit (CKSyncEngine) silent change pushes
        # Only modes the app actually uses are declared (App Review guideline 2.5.4);
        # each has a registered handler in AppDelegate.
        UIBackgroundModes:
          - audio
          - fetch
          - processing
          # CKSyncEngine receives remote record changes via silent push (step 3).
          - remote-notification

        # ── Background task identifiers ────────────────────────────────────
        # Must match BackgroundTaskCoordinator.{feedRefreshIdentifier,feedProcessingIdentifier}.
        BGTaskSchedulerPermittedIdentifiers:
          - com.autohop.feedrefresh
          - com.autohop.feedprocessing

        # ── Network (App Transport Security) ───────────────────────────────
        # NSAllowsArbitraryLoads is required and is the standard, defensible
        # posture for a podcast client: feeds, episode audio/video enclosures,
        # and artwork are fetched (via URLSession) from arbitrary third-party
        # hosts chosen by the user or surfaced by Apple's public charts. Many
        # podcast hosts still serve plain HTTP, and the host set is unbounded and
        # unknown at build time, so per-domain NSExceptionDomains cannot
        # enumerate it. Autohop adds NO first-party HTTP endpoints (it runs no
        # server). Apple permits this for apps connecting to servers the
        # developer does not control; justification is in App Review notes
        # (APPSTORE_ROADMAP.md, Review Notes appendix).
        #
        # DO NOT add the granular keys (NSAllowsArbitraryLoadsForMedia /
        # …InWebContent / …InLocalNetworking): on iOS 10+ their mere presence
        # makes the system IGNORE NSAllowsArbitraryLoads, which would block the
        # URLSession HTTP loads (feed refresh, downloads, artwork) we depend on.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

        # ── Privacy ────────────────────────────────────────────────────────
        # Autohop does not use the microphone, camera, contacts, location,
        # photos, or any other sensitive capability. No strings are required
        # for those. UserNotifications permission is requested at runtime.

        # ── App Store ──────────────────────────────────────────────────────
        ITSAppUsesNonExemptEncryption: false
        # ── CarPlay ────────────────────────────────────────────────────────
        # CarPlay Audio App entitlement approved June 2026. The CarPlay scene
        # uses Apple's template application scene and is implemented in Phase 1
        # by CarPlaySceneDelegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneClassName: CPTemplateApplicationScene
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate

    # ── Entitlements ───────────────────────────────────────────────────────
    # Time Sensitive Notifications: lets the Sleep Schedule "Are you still
    # listening?" prompt (NotificationService.postSleepSchedulePrompt) break
    # through Sleep Focus / Do Not Disturb via interruptionLevel = .timeSensitive.
    # Declared here (not just in Xcode's UI) so `xcodegen generate` preserves it.
    entitlements:
      path: Autohop.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        # Cross-device sync (build step 3). Requires the CloudKit capability to
        # be enabled on the Apple Developer account / provisioning profile.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.kevinperry.autohop
        com.apple.developer.icloud-services:
          - CloudKit
        # Home/Lock Screen widget snapshot + prepared thumbnails. This App Group
        # is device-local presentation storage; it never contains CloudKit data,
        # media paths, credentials, or the Autohop database.
        com.apple.security.application-groups:
          - group.com.kevinperry.autohop
        # CarPlay Audio App (CarPlay framework). Approved by Apple Developer
        # Relations in June 2026; keep in XcodeGen so regenerated projects
        # preserve the managed capability.
        com.apple.developer.carplay-audio: true
        # Push entitlement for CKSyncEngine silent change pushes.
        #
        # AI CONTEXT — OPEN RISK, DO NOT TREAT AS SETTLED. This relies on Xcode
        # rewriting "development" to "production" during distribution signing.
        # The tvOS target below deliberately does NOT rely on that: it pins a
        # separate TV/AutohopTV.Release.entitlements with
        # aps-environment: production, with the comment "so an App Store archive
        # cannot claim the sandbox environment even if source generation/signing
        # drifts." Both statements cannot be right. iOS is the target that still
        # takes the risk.
        #
        # Consequence if the rewrite does not happen: the shipped iPhone build
        # registers an APNs SANDBOX token, production CloudKit pushes are never
        # delivered, and cross-device sync silently degrades to the foreground
        # prime in AppRuntimeWorkflow/SyncCoordinator — changes made on Apple TV
        # or a second iPhone appear only when the user next foregrounds the app.
        # It fails quietly: no error, no log, just latency.
        #
        # EXISTING MITIGATION (do not remove): Scripts/validate-release.sh
        # --archive <path> reads the SIGNED entitlements from the .xcarchive and
        # hard-fails unless aps-environment == "production". That check cannot
        # run in CI (an unsigned checkout has no signed entitlements), so
        # .github/workflows/release-guards.yml runs only --configuration-only,
        # which explicitly skips it. The APNs guarantee is therefore a MANUAL
        # pre-upload step, not an automated one.
        #
        # Suggested hardening (mirrors tvOS, makes the manual step a
        # confirmation rather than the sole defence): add
        # Autohop.Release.entitlements with aps-environment: production and set
        # CODE_SIGN_ENTITLEMENTS per configuration, as the tvOS target does.
        aps-environment: development

    # System frameworks — AVKit pulls in AVFoundation transitively but listed
    # explicitly so the linker flags are unambiguous.
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CarPlay.framework
      - sdk: MediaPlayer.framework
      - sdk: BackgroundTasks.framework
      - sdk: MetricKit.framework
      - sdk: UserNotifications.framework
      - sdk: CloudKit.framework
      # Stage 2 widget publisher requests targeted reloads and hashes the
      # display-only projection before App Group writes.
      - sdk: WidgetKit.framework
      - sdk: CryptoKit.framework
      - sdk: AppIntents.framework
      - package: GRDB
      # Embedded WidgetKit extension. Its target is intentionally independent of
      # AutohopCore and GRDB; the only shared Swift sources are Widgets/Shared.
      - target: AutohopWidgets
        embed: true

    scheme:
      gatherCoverageData: false
      testTargets:
        - AutohopTests

  # ── Home and Lock Screen widgets ──────────────────────────────────────────
  # AI CONTEXT — Stage 2 read-only implementation for the device-local "Now Playing & Up
  # Next" widget. The extension renders a compact App Group snapshot prepared
  # by the iPhone app. It must never link AutohopCore/GRDB, open the application
  # database, or perform artwork networking. Home Screen families are live;
  # accessory families remain static until Stage 4 privacy/StandBy work.

  AutohopWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - AutohopWidgets.entitlements
      # AI CONTEXT — The widget reads shared UserDefaults and file-backed snapshot
      # metadata independently of the containing app. Embed the same required-
      # reason API declaration in the extension bundle; app-level coverage must
      # not be assumed to satisfy App Store validation for an embedded executable.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinperry.autohop.widgets
        PRODUCT_NAME: AutohopWidgets
        # AI CONTEXT — Keep the embedded widget in lockstep with the universal
        # iOS app. A phone-only extension would silently withhold widgets from
        # native iPad and compatible Designed-for-iPad Mac installations.
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QT3N6256FG
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Autohop Widgets
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        GitCommitSHA: unavailable
        GitWorkingTreeDirty: unknown
        SourceFingerprint: unavailable
        BuildTimestampUTC: unavailable
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/AutohopWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kevinperry.autohop
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework

  # ── Apple TV app (tvOS Phase 1 scaffolding) ────────────────────────────────
  # Streaming-first lean-back surface (Docs/TVOS_APP_IMPLEMENTATION_PROPOSAL.md).
  # Sources are TV/ + the AutohopCore package product ONLY. The database lives
  # in Caches (purgeable, T2); durable state is the UserDefaults survival kit +
  # CloudKit. App icon: the tvOS layered brand-assets stack (parallax layers
  # derived from Design/AppIcon/autohop-icon-v1.svg) is DELIBERATELY not
  # scaffolded here — add it in Xcode when the art is ready, then set
  # ASSETCATALOG_COMPILER_APPICON_NAME on this target.

  AutohopTV:
    type: application
    platform: tvOS
    # CORRECTED in Phase 2 (2026-07-04) from the Phase 1 scaffold's "17.0":
    # §7 item 1's own navigation shell (`.tabViewStyle(.sidebarAdaptable)`,
    # the tvOS 18 `Tab(_:systemImage:value:)` builder) needs tvOS 18+, and the
    # Pocket Casts reference target itself ships tvOS 18. tvOS 17 support
    # would mean either a second, older navigation code path or dropping the
    # proposal's own chosen APIs — not worth it for a brand-new 2026 TV app.
    deploymentTarget: "18.0"
    sources:
      - path: TV
        excludes:
          - "**/*.md"
          - "*.entitlements"
      # AI CONTEXT — Required-reason API declarations are per executable
      # bundle. Keep the shared manifest as an explicit app resource; the TV
      # source glob cannot discover this repository-root file.
      - path: PrivacyInfo.xcprivacy
    postBuildScripts:
      - name: Embed Git Commit Identity
        script: Scripts/embed-git-commit.sh
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/autohop-provenance-embedded"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinperry.autohop
        TARGETED_DEVICE_FAMILY: "3"          # Apple TV
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "13"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QT3N6256FG
        # Set 2026-07-04 once Kevin created the tvOS App Icon & Top Shelf
        # Image asset in Xcode (TV/Media.xcassets) — Xcode named it "Brand
        # Assets". Front layer populated (flat icon, no parallax); Top Shelf
        # images deferred (need separate wide-banner art).
        ASSETCATALOG_COMPILER_APPICON_NAME: "Brand Assets"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # Development devices use APNs sandbox. Release has a separate
          # distribution entitlement file so an App Store archive cannot claim
          # the sandbox environment even if source generation/signing drifts.
          CODE_SIGN_ENTITLEMENTS: TV/AutohopTV.entitlements
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          CODE_SIGN_ENTITLEMENTS: TV/AutohopTV.Release.entitlements
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: Autohop
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        GitCommitSHA: unavailable
        GitWorkingTreeDirty: unknown
        SourceFingerprint: unavailable
        BuildTimestampUTC: unavailable
        # Audio keeps playing when the TV UI sleeps. Remote notifications are
        # retained solely for CKSyncEngine's private CloudKit change delivery.
        UIBackgroundModes:
          - audio
          - remote-notification
        # Lean-back media surface — dark only.
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities:
          - arm64
        # Same unbounded-podcast-hosts ATS rationale as the iOS target above.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.kevinperry.autohop.tv-navigation
            CFBundleURLSchemes:
              - autohop
    # Declared explicitly (2026-07-11) after the AutohopTV scheme vanished from
    # Xcode's scheme picker: it was only ever an Xcode-AUTOCREATED scheme living
    # in the project's user data, and any `xcodegen generate` that rewrites the
    # project can reset it. A target-level scheme here is regenerated every time,
    # like the iPhone target's above.
    scheme:
      gatherCoverageData: false
      testTargets:
        - AutohopTVTests

    dependencies:
      - package: AutohopCore
        product: AutohopCore
      - sdk: CloudKit.framework
      - sdk: AVFoundation.framework
      - sdk: TVServices.framework
      - target: AutohopTVTopShelf
        embed: true

  # ── Dynamic Apple TV Top Shelf extension ──────────────────────────────────
  # AI CONTEXT — Read-only TVServices renderer of the atomic App Group
  # presentation snapshot prepared by AutohopTV. It deliberately does not link
  # AutohopCore, GRDB, CloudKit, AVKit or any production persistence service.
  AutohopTVTopShelf:
    type: app-extension
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: TVTopShelf
        excludes:
          - AutohopTVTopShelf.entitlements
          - "**/*.md"
      - path: TV/TopShelf/Shared
      # AI CONTEXT — Extensions cannot inherit the containing app's required-
      # reason declarations. Top Shelf uses UserDefaults and file metadata, so
      # it must carry its own copy of the shared privacy manifest.
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinperry.autohop.TopShelf
        PRODUCT_NAME: AutohopTVTopShelf
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "13"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QT3N6256FG
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: TVTopShelf/AutohopTVTopShelf.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: TVTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Autohop Top Shelf
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).TopShelfContentProvider"
        UIRequiredDeviceCapabilities:
          - arm64
    dependencies:
      - sdk: TVServices.framework

  # tvOS-only regression tests. Kept separate from AutohopTests so these tests
  # can import TVAppModel's canonical resolver without linking any TV source
  # into the iPhone application or changing iPhone runtime behaviour.
  AutohopTVTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - TVTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autohop.tv.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AutohopTV
        embed: false
      - package: AutohopCore
        product: AutohopCore

  # ── Unit tests ─────────────────────────────────────────────────────────────

  AutohopTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          # CLI-style smoke test — uses fatalError top-level code, not XCTest.
          # Run it via `swift run RSSParserSmoke` instead.
          - RSSParserSmokeTest.swift
      # Fixture XML is picked up automatically as a bundle resource because
      # XcodeGen treats non-Swift files in source paths as resources.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autohop.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Autohop
        embed: false
      # AI CONTEXT — A small subset of cross-platform contract tests imports
      # AutohopCore directly (for example ShareURLResolverTests), while iOS
      # integration tests import the application module. Both dependencies are
      # intentional; the test bundle does not embed either product.
      - package: AutohopCore
        product: AutohopCore
