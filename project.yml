# ============================================================
# Autohop — XcodeGen project specification
# ============================================================
#
# Prerequisites:
#   brew install xcodegen
#
# Generate the Xcode project:
#   cd work/Autohop
#   xcodegen generate
#
# First-time Xcode setup (one-time, ~2 minutes):
#   1. Open Autohop.xcodeproj
#   2. Select the Autohop target → Signing & Capabilities
#   3. Choose your Team and confirm the bundle ID
#   4. Select any iPhone simulator → ▶ Run
#
# The SwiftPM package (Package.swift) stays intact for the
# smoke-test executables — run them with `swift run <name>`.
# ============================================================

name: Autohop

options:
  xcodeVersion: "15.4"
  createIntermediateGroups: true   # mirrors the folder hierarchy in Xcode's navigator
  generateEmptyDirectories: false

# ── Global build settings ────────────────────────────────────────────────────

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    ALWAYS_SEARCH_USER_PATHS: false
    CLANG_ENABLE_MODULES: true

configs:
  Debug: debug
  Release: release

# ── Targets ──────────────────────────────────────────────────────────────────

targets:

  # ── App ────────────────────────────────────────────────────────────────────

  Autohop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # Include everything in this directory EXCEPT the SwiftPM artefacts and
    # the smoke-test executables (which all contain top-level `main.swift`
    # files that would conflict with `@main AutohopApp`).
    sources:
      - path: .
        excludes:
          - Package.swift                    # SwiftPM manifest — would compile as source
          - Package.resolved
          - project.yml
          - README.md
          - "**/*.md"
          - ".build/**"
          - "SmokeTests/**"                  # contains main.swift
          - "OPMLSmokeTests/**"              # contains main.swift
          - "SubscriptionStoreSmokeTests/**" # contains main.swift
          - "DownloadManagerSmokeTests/**"   # contains main.swift
          - "Tests/**"                       # picked up by AutohopTests target instead

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autohop.app   # update to match your Team ID
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule

    # Info.plist is generated by XcodeGen from the properties below.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Autohop
        CFBundleIconName: AppIcon
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"

        # ── Launch screen ──────────────────────────────────────────────────
        UILaunchScreen:
          UIColorName: LaunchBackground

        # ── Device / orientation ───────────────────────────────────────────
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # AppDelegate keeps normal screens portrait and opens video in landscape.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # ── Background modes ───────────────────────────────────────────────
        # audio      → AVAudioSession keeps playback alive when screen locks
        # fetch      → BGAppRefreshTask for periodic feed polling
        # processing → BGProcessingTask reserved for future heavy work
        UIBackgroundModes:
          - audio
          - fetch
          - processing

        # ── Background task identifiers ────────────────────────────────────
        # Must match BackgroundTaskCoordinator.feedRefreshIdentifier exactly.
        BGTaskSchedulerPermittedIdentifiers:
          - com.autohop.feedrefresh

        # ── Network ───────────────────────────────────────────────────────
        # Podcast RSS feeds and audio enclosures may be served over plain HTTP.
        # Tighten this (remove NSAllowsArbitraryLoads, add per-domain exceptions)
        # before App Store submission.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

        # ── Privacy ────────────────────────────────────────────────────────
        # Autohop does not use the microphone, camera, contacts, location,
        # photos, or any other sensitive capability. No strings are required
        # for those. UserNotifications permission is requested at runtime.

        # ── App Store ──────────────────────────────────────────────────────
        ITSAppUsesNonExemptEncryption: false

    # System frameworks — AVKit pulls in AVFoundation transitively but listed
    # explicitly so the linker flags are unambiguous.
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
      - sdk: BackgroundTasks.framework
      - sdk: UserNotifications.framework

    scheme:
      gatherCoverageData: false
      testTargets:
        - AutohopTests

  # ── Unit tests ─────────────────────────────────────────────────────────────

  AutohopTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          # CLI-style smoke test — uses fatalError top-level code, not XCTest.
          # Run it via `swift run RSSParserSmoke` instead.
          - RSSParserSmokeTest.swift
      # Fixture XML is picked up automatically as a bundle resource because
      # XcodeGen treats non-Swift files in source paths as resources.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autohop.app.tests
    dependencies:
      - target: Autohop
        embed: false
