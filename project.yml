# ============================================================
# Autohop — XcodeGen project specification
# ============================================================
#
# Prerequisites:
#   brew install xcodegen
#
# Generate the Xcode project:
#   cd work/Autohop
#   xcodegen generate
#
# First-time Xcode setup (one-time, ~2 minutes):
#   1. Open Autohop.xcodeproj
#   2. Select the Autohop target → Signing & Capabilities
#   3. Choose your Team and confirm the bundle ID
#   4. Select any iPhone simulator → ▶ Run
#
# The SwiftPM package (Package.swift) stays intact for the
# smoke-test executables — run them with `swift run <name>`.
# ============================================================

name: Autohop

options:
  xcodeVersion: "15.4"
  createIntermediateGroups: true   # mirrors the folder hierarchy in Xcode's navigator
  generateEmptyDirectories: false

# ── Global build settings ────────────────────────────────────────────────────

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    ALWAYS_SEARCH_USER_PATHS: false
    CLANG_ENABLE_MODULES: true

configs:
  Debug: debug
  Release: release

# ── Swift Package dependencies ───────────────────────────────────────────────
# The app target compiles the AutohopCore sources directly (see below), so the
# GRDB SQLite dependency that AutohopDatabase.swift needs is declared here for
# the Xcode build. Keep the version in sync with Package.swift.
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0

# ── Targets ──────────────────────────────────────────────────────────────────

targets:

  # ── App ────────────────────────────────────────────────────────────────────

  Autohop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # Include everything in this directory EXCEPT the SwiftPM artefacts and
    # the smoke-test executables (which all contain top-level `main.swift`
    # files that would conflict with `@main AutohopApp`).
    sources:
      - path: .
        excludes:
          - Package.swift                    # SwiftPM manifest — would compile as source
          - Package.resolved
          - project.yml
          - README.md
          - "**/*.md"
          - ".build/**"
          - ".git/**"                        # git internals — never bundle as app resources
                                             # (branch/tag/log basenames can collide → "duplicate output file")
          - "SmokeTests/**"                  # contains main.swift
          - "OPMLSmokeTests/**"              # contains main.swift
          - "SubscriptionStoreSmokeTests/**" # contains main.swift
          - "DownloadManagerSmokeTests/**"   # contains main.swift
          - "StatsSmokeTests/**"             # contains main.swift
          - "Tests/**"                       # picked up by AutohopTests target instead

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevinperry.autohop
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only — explicit on the app target
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QT3N6256FG          # Kevin Perry — keeps signing through regen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule

    # Info.plist is generated by XcodeGen from the properties below.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Autohop
        CFBundleIconName: AppIcon
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"

        # ── Launch screen ──────────────────────────────────────────────────
        UILaunchScreen:
          UIColorName: LaunchBackground

        # ── Device / orientation ───────────────────────────────────────────
        UIRequiredDeviceCapabilities:
          - arm64
        # AppDelegate keeps normal screens portrait and opens video in landscape.
        # v1 is iPhone-only (TARGETED_DEVICE_FAMILY = 1); no ~ipad variants.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # ── Background modes ───────────────────────────────────────────────
        # audio      → AVAudioSession keeps playback alive when screen locks
        # fetch      → BGAppRefreshTask for short periodic feed polling
        # processing → BGProcessingTask for a longer charging+Wi-Fi feed catch-up
        #              (drains the due-feed backlog, e.g. overnight)
        # remote-notification → CloudKit (CKSyncEngine) silent change pushes
        # Only modes the app actually uses are declared (App Review guideline 2.5.4);
        # each has a registered handler in AppDelegate.
        UIBackgroundModes:
          - audio
          - fetch
          - processing
          # CKSyncEngine receives remote record changes via silent push (step 3).
          - remote-notification

        # ── Background task identifiers ────────────────────────────────────
        # Must match BackgroundTaskCoordinator.{feedRefreshIdentifier,feedProcessingIdentifier}.
        BGTaskSchedulerPermittedIdentifiers:
          - com.autohop.feedrefresh
          - com.autohop.feedprocessing

        # ── Network (App Transport Security) ───────────────────────────────
        # NSAllowsArbitraryLoads is required and is the standard, defensible
        # posture for a podcast client: feeds, episode audio/video enclosures,
        # and artwork are fetched (via URLSession) from arbitrary third-party
        # hosts chosen by the user or surfaced by Apple's public charts. Many
        # podcast hosts still serve plain HTTP, and the host set is unbounded and
        # unknown at build time, so per-domain NSExceptionDomains cannot
        # enumerate it. Autohop adds NO first-party HTTP endpoints (it runs no
        # server). Apple permits this for apps connecting to servers the
        # developer does not control; justification is in App Review notes
        # (APPSTORE_ROADMAP.md, Review Notes appendix).
        #
        # DO NOT add the granular keys (NSAllowsArbitraryLoadsForMedia /
        # …InWebContent / …InLocalNetworking): on iOS 10+ their mere presence
        # makes the system IGNORE NSAllowsArbitraryLoads, which would block the
        # URLSession HTTP loads (feed refresh, downloads, artwork) we depend on.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

        # ── Privacy ────────────────────────────────────────────────────────
        # Autohop does not use the microphone, camera, contacts, location,
        # photos, or any other sensitive capability. No strings are required
        # for those. UserNotifications permission is requested at runtime.

        # ── App Store ──────────────────────────────────────────────────────
        ITSAppUsesNonExemptEncryption: false

    # ── Entitlements ───────────────────────────────────────────────────────
    # Time Sensitive Notifications: lets the Sleep Schedule "Are you still
    # listening?" prompt (NotificationService.postSleepSchedulePrompt) break
    # through Sleep Focus / Do Not Disturb via interruptionLevel = .timeSensitive.
    # Declared here (not just in Xcode's UI) so `xcodegen generate` preserves it.
    entitlements:
      path: Autohop.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        # Cross-device sync (build step 3). Requires the CloudKit capability to
        # be enabled on the Apple Developer account / provisioning profile.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.kevinperry.autohop
        com.apple.developer.icloud-services:
          - CloudKit
        # Push entitlement for CKSyncEngine silent change pushes. "development"
        # is correct for debug/sandbox; Xcode rewrites it to "production" when
        # archiving for distribution.
        aps-environment: development

    # System frameworks — AVKit pulls in AVFoundation transitively but listed
    # explicitly so the linker flags are unambiguous.
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
      - sdk: BackgroundTasks.framework
      - sdk: UserNotifications.framework
      - sdk: CloudKit.framework
      - package: GRDB

    scheme:
      gatherCoverageData: false
      testTargets:
        - AutohopTests

  # ── Unit tests ─────────────────────────────────────────────────────────────

  AutohopTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          # CLI-style smoke test — uses fatalError top-level code, not XCTest.
          # Run it via `swift run RSSParserSmoke` instead.
          - RSSParserSmokeTest.swift
      # Fixture XML is picked up automatically as a bundle resource because
      # XcodeGen treats non-Swift files in source paths as resources.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.autohop.app.tests
    dependencies:
      - target: Autohop
        embed: false
