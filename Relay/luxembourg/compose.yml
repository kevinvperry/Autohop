services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_TOKENS: ${RELAY_TOKENS:?Set individual random relay tokens}
      LU_EGRESS_VERIFIED: ${LU_EGRESS_VERIFIED:-false}
    expose: ["8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      RELAY_HOST: ${RELAY_HOST:?Set the public DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
